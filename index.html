function renderHome(){let completed=lessonDone.size;return `<h2>Καλώς ήρθες!</h2><p class="intro">Θα εξασκηθούμε στην πλοήγηση στα Windows. Διάλεξε μία δραστηριότητα. Μπορείς να ζητήσεις βοήθεια και να δοκιμάσεις ξανά.</p><div class="callout"><strong>Μαθαίνουμε με τον δικό μας ρυθμό.</strong><br>Δεν υπάρχει χρονόμετρο και δεν χάνεις βαθμούς όταν κάνεις λάθος.</div><div class="homegrid"><button class="homecard" onclick="setMode('learn')"><span class="icon">📘</span><strong>Μαθαίνω βήμα βήμα</strong>Μικρά μαθήματα με οδηγίες.</button><button class="homecard" onclick="setMode('explorer')"><span class="icon">🖱️</span><strong>Εξερευνώ</strong>Ανοίγω φακέλους με ένα πάτημα.</button><button class="homecard" onclick="setMode('missions')"><span class="icon">🎯</span><strong>Εξασκούμαι</strong>Διαλέγω πού θα βρω κάτι.</button><button class="homecard" onclick="setMode('organize')"><span class="icon">📂</span><strong>Τακτοποιώ αρχεία</strong>Επιλέγω αρχείο και φάκελο.</button><button class="homecard" onclick="setMode('quiz')"><span class="icon">⭐</span><strong>Τι θυμάμαι;</strong>Κάνω σύντομες ερωτήσεις.</button></div><div class="progresswrap"><strong>Η πρόοδός μου</strong><div class="progressbar" role="progressbar" aria-label="Ολοκληρωμένα μαθήματα" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${completed}"><span style="width:${completed/6*100}%"></span></div><div class="progresslabel">Ολοκλήρωσα ${completed} από 6 μαθήματα. Η πρόοδος είναι προσωρινή.</div></div>`}
function renderLesson(){const l=lessons[lessonIndex];const list=`<aside><h2>Τα μαθήματα</h2><div class="lessonlist">${lessons.map((x,i)=>`<button class="lesson-card ${i===lessonIndex?'active':''}" onclick="chooseLesson(${i})" aria-current="${i===lessonIndex?'step':'false'}"><strong>${i+1}. ${x.title}</strong><small>${lessonDone.has(i)?'Ολοκληρώθηκε':'Μάθημα'}</small></button>`).join("")}</div><div class="progresswrap"><div class="progressbar" role="progressbar" aria-label="Ολοκληρωμένα μαθήματα" aria-valuemin="0" aria-valuemax="6" aria-valuenow="${lessonDone.size}"><span style="width:${lessonDone.size/6*100}%"></span></div><div class="progresslabel">${lessonDone.size} από 6 ολοκληρωμένα</div></div></aside>`;
let content="";if(lessonStage==="intro")content=`<div aria-live="polite"><div style="font-size:2.4rem" aria-hidden="true">${l.icon}</div><p class="stepcount">ΜΑΘΗΜΑ ${lessonIndex+1} ΑΠΟ ${lessons.length}</p><h2>${l.title}</h2><div class="callout"><strong>Θυμάμαι:</strong><br>${l.remember}</div><div class="stepbox"><div class="stepinstruction">Η αποστολή μου</div>${l.task}</div><p class="intro">Θα χρησιμοποιήσεις την εκπαιδευτική Εξερεύνηση. Πάτησε μία φορά στο σωστό στοιχείο.</p><div class="buttonrow"><button class="btn primary" onclick="startLesson()">Ξεκινώ</button></div></div>`;
else if(lessonStage==="demo"){const total=l.route.length+(l.file?1:0);const step=Math.min(demoStep,total-1);const isFile=step>=l.route.length;const demoPath=["Αυτός ο υπολογιστής",...l.route.slice(0,step)];const current=demoPath[demoPath.length-1];const target=isFile?l.file:l.route[step];const items=isFile?(folders.find(f=>f.name===current)?.files||[]):getFolderItems(current);content=`<p class="stepcount">ΠΑΡΑΔΕΙΓΜΑ — ΜΑΘΗΜΑ ${lessonIndex+1} ΑΠΟ ${lessons.length}</p><h2>${l.title}</h2><div class="callout"><strong>Βλέπω πρώτα το παράδειγμα.</strong><br>${isFile?`Στον φάκελο «${current}», επιλέγω το αρχείο «${target}».`:`Στο «${current}», πατώ μία φορά στον φάκελο «${target}».`}</div>${renderMiniExplorer(demoPath,items,true,true,target)}<p class="progresslabel">Βήμα παραδείγματος ${step+1} από ${total}. Το μπλε περίγραμμα δείχνει τι επιλέγουμε.</p><div class="buttonrow"><button class="btn secondary" onclick="demoBack()" ${demoStep===0?'disabled':''}>← Προηγούμενο βήμα</button><button class="btn primary" onclick="${step+1>=total?'startPractice()':'demoNext()'}">${step+1>=total?'Τώρα δοκιμάζω μόνη/ος':'Επόμενο βήμα →'}</button><button class="btn secondary" onclick="startPractice()">Παράλειψη παραδείγματος</button></div>`}
else if(lessonStage==="practice"){const current=lessonPath[lessonPath.length-1];const expected=l.route[lessonStep];let expectedFile=l.file&&lessonStep>=l.route.length;let items=expectedFile?(folders.find(f=>f.name===current)?.files||[]):getFolderItems(current);content=`<p class="stepcount">ΜΑΘΗΜΑ ${lessonIndex+1} ΑΠΟ ${lessons.length}</p><h2>${l.title}</h2><div class="stepbox"><div class="stepcount">ΒΗΜΑ ${Math.min(lessonStep+1,l.route.length+(l.file?1:0))} ΑΠΟ ${l.route.length+(l.file?1:0)}</div><div class="stepinstruction">${expectedFile?`Βρες το αρχείο «${l.file}».`:`Πάτησε: ${expected||""}`}</div><span>Πάτησε μία φορά στο σωστό στοιχείο. Μπορείς να δοκιμάσεις ξανά.</span></div>${renderMiniExplorer(lessonPath,items,true)}<div id="lessonFeedback" class="feedback" role="status">${notice}</div><div class="buttonrow"><button class="btn secondary" onclick="lessonBack()">← Πίσω</button><button class="btn secondary" onclick="lessonStage='intro';notice='';render()">Παύση μαθήματος</button></div>`}
else content=`<div class="successbox"><h2>Μπράβο! Ολοκλήρωσες το μάθημα.</h2><p>Έκανες τα βήματα με επιτυχία. Μπορείς να συνεχίσεις ή να ξανακάνεις το μάθημα.</p></div><div class="callout"><strong>Θυμάμαι:</strong><br>${l.remember}</div><div class="buttonrow"><button class="btn primary" onclick="chooseLesson(${Math.min(lessonIndex+1,lessons.length-1)})">${lessonIndex===lessons.length-1?'Ξαναβλέπω το μάθημα':'Επόμενο μάθημα →'}</button><button class="btn secondary" onclick="setMode('home')">Επιστροφή στην αρχή</button></div>`;
return `<div class="lesson-layout">${list}<section>${content}</section></div>`}
function getFolderItems(current){if(current==="Αυτός ο υπολογιστής")return [folders[1]];if(current==="Δίσκος C:")return folders.filter(f=>folderNames.includes(f.name));return folders.find(f=>f.name===current)?.files||[]}
function renderMiniExplorer(currentPath,items,lesson=false,demo=false,target=""){const crumbs=currentPath.map((p,i)=>`<button class="pathpart" onclick="${lesson?`lessonJump(${i})`:`explorerJump(${i})`}">${i===0?'🏠 ':''}${p}</button>`).join('<span aria-hidden="true"> › </span>');const rows=items.length?items.map(item=>`<button class="folder-choice ${demo&&item.name===target?'demo-target':''}" ${demo?'disabled':`onclick="${lesson?`lessonChoose('${item.name}')`:`explorerChoose('${item.name}')`}"`}><span class="bigicon" aria-hidden="true">${item.icon||'📄'}</span><strong>${item.name}</strong></button>`).join(''):'<p>Δεν υπάρχουν άλλα στοιχεία εδώ.</p>';return `<div class="explorer"><div class="explorerhead"><span>📁 Εξερεύνηση αρχείων</span><span class="windowmarks" aria-hidden="true">— □ ×</span></div><div class="explorer-toolbar" aria-hidden="true"><span>←</span><span>→</span><span>↑</span><span>⟳</span><span>⋯</span></div><div class="explorer-body"><aside class="explorer-side" aria-hidden="true"><div>🏠 Αρχική</div><div>🖼️ Συλλογή</div><div>☁️ OneDrive</div><div>▸ Επιφάνεια εργασίας</div><div>▸ Λήψεις</div><div>▸ Έγγραφα</div><div>▸ Εικόνες</div><div class="side-current">▾ Αυτός ο υπολογιστής</div><div>　💽 Δίσκος C:</div></aside><div class="explorer-main"><div class="pathbar" aria-label="Τοποθεσία">${crumbs}</div><div class="explorer-columns"><span>Όνομα</span><span>Τύπος</span></div><div class="folderbuttons">${rows}</div></div></div></div>`}
function chooseLesson(i){lessonIndex=i;lessonStage="intro";lessonStep=0;demoStep=0;lessonPath=["Αυτός ο υπολογιστής"];notice="";render()}
function startLesson(){lessonStage="demo";demoStep=0;lessonStep=0;lessonPath=["Αυτός ο υπολογιστής"];notice="";render()}
function demoNext(){const l=lessons[lessonIndex];demoStep=Math.min(demoStep+1,l.route.length+(l.file?1:0)-1);render()}
function demoBack(){if(demoStep>0)demoStep--;else lessonStage="intro";render()}
function startPractice(){lessonStage="practice";lessonStep=0;lessonPath=["Αυτός ο υπολογιστής"];notice="";render()}
function lessonChoose(name){const l=lessons[lessonIndex];const expectedFile=l.file&&lessonStep>=l.route.length;if(expectedFile){if(name===l.file){lessonStage="done";lessonDone.add(lessonIndex);notice=""}else notice="Αυτό είναι άλλο αρχείο. Δοκίμασε ξανά."}else if(name===l.route[lessonStep]){lessonPath.push(name);lessonStep++;if(lessonStep>=l.route.length&&!l.file){lessonStage="done";lessonDone.add(lessonIndex);notice=""}else notice="Σωστά. Συνέχισε στο επόμενο βήμα."}else notice="Δεν πειράζει. Κοίτα την οδηγία και δοκίμασε ξανά.";render()}
function lessonJump(i){const l=lessons[lessonIndex];lessonPath=lessonPath.slice(0,i+1);lessonStep=Math.min(i,l.route.length);notice="";render()}
function lessonBack(){if(lessonPath.length>1){lessonPath.pop();lessonStep=Math.max(0,lessonStep-1);notice="";render()}else{lessonStage="intro";render()}}
function renderExplorer(){const current=path[path.length-1],items=getFolderItems(current);return `<h2>🖱️ Εξερευνώ τα Windows</h2><p class="intro">Πάτησε μία φορά σε έναν φάκελο για να τον ανοίξεις. Για να γυρίσεις πίσω, πάτησε ένα όνομα στη διαδρομή.</p>${renderMiniExplorer(path,items,false)}<div class="buttonrow"><button class="btn secondary" onclick="explorerHome()">🏠 Αρχή</button><button class="btn secondary" onclick="explorerBack()" ${path.length<2?'disabled':''}>← Πίσω</button></div><div class="feedback" role="status">${notice||'Δοκίμασε: Αυτός ο υπολογιστής → Δίσκος C: → Εικόνες.'}</div><aside class="realworld-tip"><strong>Το δοκιμάζω και στα Windows</strong>Αυτή είναι προσομοίωση: τα αρχεία είναι παραδείγματα και δεν αλλάζουν τον υπολογιστή. Στα Windows, άνοιξε την Εξερεύνηση αρχείων (το εικονίδιο φακέλου) και ακολούθησε την ίδια διαδρομή. Η εμφάνιση μπορεί να διαφέρει λίγο ανάλογα με τον υπολογιστή.<ol class="transfer-steps"><li>Βρες «Αυτός ο υπολογιστής».</li><li>Άνοιξε τον δίσκο και μετά τον φάκελο που χρειάζεσαι.</li><li>Έλεγξε το όνομα του αρχείου πριν το ανοίξεις.</li></ol></aside>`}
function explorerChoose(name){const entry=folders.find(f=>f.name===name);if(entry&&(entry.type==='drive'||entry.type==='folder')){path.push(name);notice="Άνοιξες τον φάκελο "+name+".";render()}else{const file=folders.flatMap(f=>f.files||[]).find(f=>f.name===name);showModal(name,file?.desc||"Αυτό είναι ένα εκπαιδευτικό παράδειγμα αρχείου.")}}
function explorerJump(i){path=path.slice(0,i+1);notice="";render()}function explorerHome(){path=["Αυτός ο υπολογιστής"];notice="";render()}function explorerBack(){if(path.length>1)path.pop();notice="";render()}
function renderMissions(){const m=missions[missionIndex];return `<h2>🎯 Εξασκούμαι</h2><p class="intro">Διάβασε την αποστολή και διάλεξε μία απάντηση. Αν δυσκολευτείς, ζήτησε βοήθεια.</p><div class="taskcard"><strong>Αποστολή ${missionIndex+1} από ${missions.length}</strong><p>${m.q}</p></div><div class="choices">${m.opts.map(o=>`<button class="choice" onclick="answerMission('${o}')"><span class="bigicon" aria-hidden="true">${iconFor(o)}</span>${o}</button>`).join('')}</div><div class="buttonrow"><button class="btn secondary" onclick="showHint()">💡 Βοήθεια</button><button class="btn secondary" onclick="changeMission(-1)" ${missionIndex===0?'disabled':''}>← Προηγούμενη</button><button class="btn primary" onclick="changeMission(1)">Επόμενη →</button></div><div id="missionFeedback" class="feedback" role="status">${notice}</div><p class="note">Ολοκληρωμένες αποστολές: ${missionDone.size} από ${missions.length}</p>`}
function answerMission(answer){const m=missions[missionIndex];if(answer===m.a){missionDone.add(missionIndex);notice="Μπράβο! Αυτή είναι η σωστή απάντηση."}else notice="Δεν πειράζει. Δοκίμασε ξανά ή πάτησε Βοήθεια.";render()}
function showHint(){notice="Βοήθεια: "+missions[missionIndex].hint;render()}
function changeMission(amount){missionIndex=(missionIndex+amount+missions.length)%missions.length;notice="";render()}
function renderOrganize(){const item=sortItems[sortIndex];if(!item)return `<h2>📂 Τα κατάφερα!</h2><div class="successbox">Ολοκλήρωσες την τακτοποίηση όλων των αρχείων.</div><p>Μπορείς να ξεκινήσεις ξανά ή να διαλέξεις άλλη δραστηριότητα.</p><button class="btn primary" onclick="resetOrganize()">Ξεκινώ ξανά</button>`;return `<h2>📂 Τακτοποιώ αρχεία</h2><p class="intro">Πρώτα διάλεξε το αρχείο. Μετά πάτησε τον φάκελο που ταιριάζει. Δεν χρειάζεται να σύρεις τίποτα.</p><div class="taskcard"><strong>Αρχείο ${sortIndex+1} από ${sortItems.length}</strong><p>Σε ποιον φάκελο θα το βάλεις;</p></div><div class="sort-layout"><section><h3>Διάλεξε αρχείο</h3><div class="sort-list"><button class="file-choice selected" aria-pressed="true"><span class="bigicon" aria-hidden="true">${item.icon}</span><strong>${item.name}</strong></button></div></section><section><h3>Διάλεξε φάκελο</h3><div class="folderbuttons sort-targets">${folderNames.map(n=>`<button class="folder-choice" onclick="placeOrganize('${n}')"><span class="bigicon" aria-hidden="true">${iconFor(n)}</span><strong>${n}</strong></button>`).join('')}</div></section></div><div class="feedback sort-status" role="status">${notice}</div><div class="buttonrow"><button class="btn secondary" onclick="resetOrganize()">Ξεκινώ από την αρχή</button><span class="note">Σωστά τοποθετημένα: ${sortDone.size} από ${sortItems.length}</span></div>`}
function placeOrganize(folder){if(folder===sortItems[sortIndex].target){sortDone.add(sortIndex);notice="Σωστά! Το αρχείο ταιριάζει σε αυτόν τον φάκελο.";sortIndex++;}else notice="Δεν πειράζει. Δοκίμασε έναν άλλο φάκελο.";render()}
function resetOrganize(){sortIndex=0;sortDone.clear();notice="";render()}
function renderQuiz(){if(quizIndex>=quiz.length)return `<h2>⭐ Ολοκλήρωσες τις ερωτήσεις!</h2><div class="successbox">Μπράβο που προσπάθησες. Δεν χρειάζεται να είναι όλες οι απαντήσεις σωστές με την πρώτη.</div><p>Σωστές απαντήσεις: ${quizDone.size} από ${quiz.length}.</p><div class="buttonrow"><button class="btn primary" onclick="resetQuiz()">Ξανακάνω τις ερωτήσεις</button><button class="btn secondary" onclick="setMode('home')">Επιστροφή στην αρχή</button></div>`;const q=quiz[quizIndex];return `<h2>⭐ Τι θυμάμαι;</h2><p class="intro">Διάλεξε μία απάντηση. Μπορείς να δοκιμάσεις ξανά.</p><div class="taskcard"><strong>Ερώτηση ${quizIndex+1} από ${quiz.length}</strong><p>${q.q}</p></div><div class="choices">${q.opts.map(o=>`<button class="choice" onclick="answerQuiz('${o}')"><span class="bigicon" aria-hidden="true">${iconFor(o)}</span>${o}</button>`).join('')}</div><div class="feedback" role="status">${notice}</div><div class="buttonrow"><button class="btn secondary" onclick="quizIndex=Math.max(0,quizIndex-1);quizAnswered=quizDone.has(quizIndex);notice='';render()" ${quizIndex===0?'disabled':''}>← Προηγούμενη</button>${quizAnswered?`<button class="btn primary" onclick="quizIndex++;quizAnswered=false;notice='';render()">Επόμενη →</button>`:''}</div><p class="note">Σωστές απαντήσεις: ${quizDone.size} από ${quiz.length}</p>`}
function answerQuiz(answer){const q=quiz[quizIndex];if(answer===q.a){quizDone.add(quizIndex);quizAnswered=true;notice="Σωστά! "+q.why}else notice="Δοκίμασε ξανά. Βοήθεια: "+q.why;render()}
function resetQuiz(){quizIndex=0;quizAnswered=false;quizDone.clear();notice="";render()}
function render(){const main=$("main");main.innerHTML=mode==="home"?renderHome():mode==="learn"?renderLesson():mode==="explorer"?renderExplorer():mode==="missions"?renderMissions():mode==="organize"?renderOrganize():renderQuiz();document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.mode===mode?'page':'false'))}
function showModal(title,body){modalReturn=document.activeElement;$("modalTitle").textContent=title;$("modalBody").textContent=body;$("modal").classList.add("show");$("modal").querySelector("button").focus()}
function closeModal(){$("modal").classList.remove("show");if(modalReturn&&modalReturn.focus)modalReturn.focus()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$("modal").classList.contains('show'))closeModal()});
render();
</script>
<div id="liveStatus" class="sr-only" aria-live="polite"></div>
</body>
</html>
